name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          sw_vers
          xcodebuild -version

      - name: Unzip source
        run: |
          set -e
          unzip -o WeChatVerFix-src.zip -d src
          ls -la src src/WeChatVerFix

      - name: Install tools
        run: |
          brew install xcodegen ldid

      - name: Generate project
        working-directory: src/WeChatVerFix
        run: xcodegen generate

      - name: Build unsigned
        working-directory: src/WeChatVerFix
        run: |
          set -e
          xcodebuild \
            -project WeChatVerFix.xcodeproj \
            -scheme WeChatVerFix \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: src/WeChatVerFix
        run: |
          set -e
          APP=$(find build -maxdepth 6 -name "WeChatVerFix.app" -type d | head -1)
          echo "APP=$APP"
          rm -rf ipa_root && mkdir -p ipa_root/Payload
          cp -R "$APP" ipa_root/Payload/
          ldid -SWeChatVerFix/entitlements.plist ipa_root/Payload/WeChatVerFix.app/WeChatVerFix
          echo "--- entitlements on binary ---"
          ldid -e ipa_root/Payload/WeChatVerFix.app/WeChatVerFix || true
          cd ipa_root && zip -qry ../WeChatVerFix.ipa Payload
          cd .. && ls -la WeChatVerFix.ipa && unzip -l WeChatVerFix.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatVerFix-ipa
          path: src/WeChatVerFix/WeChatVerFix.ipa
          if-no-files-found: error
