name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          sw_vers
          xcodebuild -version
          ls -la

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project WeChatVerFix.xcodeproj \
            -scheme WeChatVerFix \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Build root helper (wvfixd)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -mios-version-min=11.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -o wvfixd_bin \
            tool/wvfixd.m
          file wvfixd_bin
          lipo -info wvfixd_bin || true

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -mios-version-min=11.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -o wvfdaemon_bin \
            tool/wvfdaemon.m
          file wvfdaemon_bin

      - name: Generate IconFix project
        run: |
          cd iconfix
          xcodegen generate

      - name: Build IconFix
        run: |
          cd iconfix
          xcodebuild             -project IconFix.xcodeproj             -scheme IconFix             -sdk iphoneos             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build

      - name: Package IconFix IPA
        run: |
          set -e
          APP=$(find iconfix/build -maxdepth 6 -name "IconFix.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf iconfix_root && mkdir -p iconfix_root/Payload
          cp -R "$APP" iconfix_root/Payload/
          ldid -SWeChatVerFix/entitlements.plist iconfix_root/Payload/IconFix.app/IconFix
          ( cd iconfix_root && zip -qry ../IconFix.ipa Payload )
          ls -la IconFix.ipa

      - name: Package IPA
        run: |
          set -e
          APP=$(find build -maxdepth 6 -name "WeChatVerFix.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf ipa_root && mkdir -p ipa_root/Payload
          cp -R "$APP" ipa_root/Payload/

          # 把 root 助手放进 bundle 并单独签名
          cp wvfixd_bin ipa_root/Payload/WeChatVerFix.app/wvfixd
          chmod 755 ipa_root/Payload/WeChatVerFix.app/wvfixd
          ldid -SWeChatVerFix/entitlements.plist ipa_root/Payload/WeChatVerFix.app/wvfixd

          cp wvfdaemon_bin ipa_root/Payload/WeChatVerFix.app/wvfdaemon
          chmod 755 ipa_root/Payload/WeChatVerFix.app/wvfdaemon
          ldid -SWeChatVerFix/entitlements.plist ipa_root/Payload/WeChatVerFix.app/wvfdaemon

          # 内置 TrollStore 官方 trollstorehelper（完整移植重建图标缓存）
          if [ -f tool/trollstorehelper_arm64 ]; then
            cp tool/trollstorehelper_arm64 ipa_root/Payload/WeChatVerFix.app/trollstorehelper
            chmod 755 ipa_root/Payload/WeChatVerFix.app/trollstorehelper
            ldid -SWeChatVerFix/entitlements.plist ipa_root/Payload/WeChatVerFix.app/trollstorehelper
            echo "--- trollstorehelper 已打包 ---"
            ls -l ipa_root/Payload/WeChatVerFix.app/trollstorehelper
          else
            echo "警告：tool/trollstorehelper_arm64 缺失"
          fi
          echo "--- helper entitlements ---"
          ldid -e ipa_root/Payload/WeChatVerFix.app/wvfixd || true

          ldid -SWeChatVerFix/entitlements.plist ipa_root/Payload/WeChatVerFix.app/WeChatVerFix
          echo "--- app entitlements ---"
          ldid -e ipa_root/Payload/WeChatVerFix.app/WeChatVerFix

          ( cd ipa_root && zip -qry ../WeChatVerFix.ipa Payload )
          ls -la WeChatVerFix.ipa
          unzip -l WeChatVerFix.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatVerFix-ipa
          path: |
            WeChatVerFix.ipa
            IconFix.ipa
          if-no-files-found: error
