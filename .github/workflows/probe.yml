name: probe

on:
  push:
  workflow_dispatch:

jobs:
  probe-linux:
    runs-on: ubuntu-latest
    steps:
      - name: hello
        run: |
          uname -a
          echo "linux runner ok"
      - name: clang and sdk availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld ldid libssl-dev libplist-dev libxml2-dev zlib1g-dev make git curl 2>&1 | tail -5
          clang --version | head -2
          ld64.lld --version || true
          ldid -v || true
